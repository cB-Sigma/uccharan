name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: "0.2.130"   # must equal the wasm-bindgen crate pinned in bindings/wasm/Cargo.toml

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add wasm32-unknown-unknown
          rustc --version && cargo --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (word tables read as packs from the source tree, see .cargo/config.toml)
        run: cargo test --workspace
      - name: Tests with every word table compiled in, and the downloader builds
        run: |
          cargo test -p uccharan --features bundle
          cargo check -p uccharan --features download
      - name: Compiled language data is up to date
        run: |
          cargo run --release -p uccharan-lexgen -- check
          cargo run --release -p uccharan-lexgen -- wikipron-check
          cargo run --release -p uccharan-lexgen -- xlit-check
          python3 tools/packs.py --check
      - name: Licence files in the packages match the repository's
        run: |
          for d in crates/uccharan crates/uccharan-data crates/uccharan-capi bindings/python bindings/wasm; do
            for f in LICENSE NOTICE DATA_LICENSES.md; do cmp "$f" "$d/$f"; done
          done
      - name: C example builds and runs against the C library
        run: |
          cargo build --release -p uccharan-capi
          cc -Wall -Wextra -Werror -I crates/uccharan-capi/include crates/uccharan-capi/examples/hello.c -L target/release -luccharan -o hello
          LD_LIBRARY_PATH=target/release ./hello
      - name: Benchmarks compile
        run: cargo bench -p uccharan --no-run
      - name: The crates package, and stay well under the registry's 10 MiB limit
        run: |
          cargo package -p uccharan-data -p uccharan --allow-dirty
          for f in target/package/uccharan-*.crate; do
            size=$(wc -c < "$f"); echo "$f: $size bytes"
            test "$size" -lt 8000000
          done

  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }} (wheel + pytest)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  python: "3.12" }
          - { os: ubuntu-latest,  python: "3.13" }
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest,   python: "3.12" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install build and test tools
        run: python -m pip install --upgrade pip "maturin>=1.7,<2" "pytest>=8"
      - name: Build the wheel
        run: maturin build --release --manifest-path bindings/python/Cargo.toml --out dist
      - name: Install the wheel
        run: python -m pip install --no-index --find-links dist uccharan
      - name: Tests (against the installed wheel)
        working-directory: bindings/python/tests
        run: python -m pytest -q .
      - name: Evaluation tools import and run without a reference phonemizer
        if: runner.os == 'Linux'
        run: |
          cargo build --release -p uccharan
          python tools/eval/gold_eval.py

  wasm:
    name: WebAssembly (build + node tests + demo site)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install the Rust toolchain and wasm-bindgen
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
      - name: Build the npm package
        run: node bindings/wasm/build.mjs
      - name: Node tests
        working-directory: bindings/wasm
        run: npm test
      - name: The WebAssembly core stays under 2.5 MB
        run: test "$(stat -c %s bindings/wasm/dist/uccharan_wasm_bg.wasm)" -lt 2621440
      - name: Assemble the demo site
        run: node demo/build.mjs
      - name: npm package contents
        working-directory: bindings/wasm
        run: npm pack --dry-run
