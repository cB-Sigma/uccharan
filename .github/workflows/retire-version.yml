# Retire a published version: yank it on crates.io and mark it deprecated on npm.
# Run by hand: Actions > Retire a version > Run workflow.
name: Retire a version

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to retire (for example 0.1.0)
        required: true
      message:
        description: Deprecation message shown by npm
        default: "Please upgrade to the latest version."

permissions:
  contents: read

jobs:
  crates:
    name: yank on crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Yank uccharan and uccharan-capi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          cargo yank --version "$VERSION" uccharan
          cargo yank --version "$VERSION" uccharan-capi || echo "uccharan-capi $VERSION: nothing to yank"

  npm:
    name: deprecate on npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Deprecate the version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
          MESSAGE: ${{ inputs.message }}
        run: npm deprecate "uccharan@$VERSION" "$MESSAGE"
