[workspace]
resolver = "2"
members = ["crates/uccharan", "crates/uccharan-capi", "bindings/python", "bindings/wasm", "tools/lexgen"]
default-members = ["crates/uccharan", "crates/uccharan-capi", "tools/lexgen"]


[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
authors = ["Abhinav Gautam <abhinav@codebuckets.in>"]
repository = "https://github.com/cB-Sigma/uccharan"
homepage = "https://cb-sigma.github.io/uccharan/"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
strip = false
