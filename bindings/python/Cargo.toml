[package]
name = "uccharan-python"
description = "Python bindings for uccharan."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
doc = false

[dependencies]
# The wheel carries en-us and Hindi; en-gb and the Kokoro English data are
# packs, fetched on first use (see python/uccharan/packs/__init__.py).
uccharan = { path = "../../crates/uccharan", default-features = false, features = ["embed-en-us", "embed-hi"] }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }

[features]
# Every word table compiled into the extension module (no downloads).
bundle = ["uccharan/bundle"]
