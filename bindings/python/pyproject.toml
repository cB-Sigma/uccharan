[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "uccharan"
version = "0.6.6"
description = "Phonemiser, text normaliser, transliterator and pronunciation engine for text-to-speech and speech recognition: 39 languages, Apache-2.0."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Abhinav Gautam", email = "abhinav@codebuckets.in" }]
keywords = ["g2p", "phonemizer", "tts", "asr", "text-normalization", "transliteration", "pronunciation", "ipa", "hindi", "hinglish", "piper", "kokoro", "sherpa-onnx"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://cb-sigma.github.io/uccharan/"
Repository = "https://github.com/cB-Sigma/uccharan"
Issues = "https://github.com/cB-Sigma/uccharan/issues"

[project.scripts]
uccharan = "uccharan.cli:main"
uccharan-train = "uccharan.train.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.maturin]
python-source = "python"
module-name = "uccharan._native"
features = ["pyo3/extension-module"]
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
