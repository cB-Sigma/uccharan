[package]
name = "uccharan-capi"
description = "C ABI for uccharan, the drop-in phonemiser for Piper, Kokoro and sherpa-onnx voices: 5× faster than espeak-ng, Apache-2.0."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["g2p", "phonemizer", "tts", "ffi"]
categories = ["text-processing", "external-ffi-bindings"]

[lib]
name = "uccharan"
crate-type = ["cdylib", "staticlib"]
doc = false

[dependencies]
uccharan_core = { package = "uccharan", path = "../uccharan", version = "0.1.0" }
