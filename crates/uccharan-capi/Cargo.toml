[package]
name = "uccharan-capi"
description = "C ABI for uccharan, the drop-in phonemiser for Piper, Kokoro and sherpa-onnx voices: 5× faster than espeak-ng, Apache-2.0."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["g2p", "phonemizer", "tts", "ffi"]
categories = ["text-processing", "external-ffi-bindings"]

[lib]
name = "uccharan"
crate-type = ["cdylib", "staticlib"]
doc = false

[dependencies]
uccharan_core = { package = "uccharan", path = "../uccharan", version = "0.2.0", default-features = false }

[features]
default = ["embed-en-us", "embed-en-gb", "embed-hi", "embed-kokoro"]
# Compile the language data into the library; without them, load packs with uccharan_load().
embed-en-us = ["uccharan_core/embed-en-us"]
embed-en-gb = ["uccharan_core/embed-en-gb"]
embed-hi = ["uccharan_core/embed-hi"]
embed-kokoro = ["uccharan_core/embed-kokoro"]
