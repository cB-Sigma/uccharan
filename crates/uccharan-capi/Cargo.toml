[package]
name = "uccharan-capi"
description = "C ABI for uccharan, the phonemiser, text normaliser, transliterator and pronunciation engine for text-to-speech and speech recognition. Apache-2.0."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["g2p", "phonemizer", "tts", "transliteration", "ffi"]
categories = ["text-processing", "external-ffi-bindings"]

[lib]
name = "uccharan"
crate-type = ["cdylib", "staticlib"]
doc = false

[dependencies]
uccharan_core = { package = "uccharan", path = "../uccharan", version = "0.6.6", default-features = false }

[features]
default = ["embed-en-us", "embed-en-gb", "embed-hi", "embed-kokoro"]
# Compile language data into the library. Without a word table, its pack is
# looked for in $UCCHARAN_DATA_DIR and the cache, or loaded with uccharan_load_pack().
embed-en-us = ["uccharan_core/embed-en-us"]
embed-en-gb = ["uccharan_core/embed-en-gb"]
embed-hi = ["uccharan_core/embed-hi"]
embed-kokoro = ["uccharan_core/embed-kokoro"]
# Every word table compiled in.
bundle = ["uccharan_core/bundle"]
# Fetch a missing pack from the GitHub release on first use.
download = ["uccharan_core/download"]
embed-ur = ["uccharan_core/embed-ur"]
embed-sd = ["uccharan_core/embed-sd"]
embed-de = ["uccharan_core/embed-de"]
embed-nl = ["uccharan_core/embed-nl"]
embed-fr = ["uccharan_core/embed-fr"]
embed-it = ["uccharan_core/embed-it"]
embed-pt-br = ["uccharan_core/embed-pt-br"]
embed-pt = ["uccharan_core/embed-pt"]
embed-pl = ["uccharan_core/embed-pl"]
embed-tr = ["uccharan_core/embed-tr"]
embed-cs = ["uccharan_core/embed-cs"]
embed-sv = ["uccharan_core/embed-sv"]
embed-ca = ["uccharan_core/embed-ca"]
embed-ro = ["uccharan_core/embed-ro"]
embed-hu = ["uccharan_core/embed-hu"]
embed-fi = ["uccharan_core/embed-fi"]
embed-nb = ["uccharan_core/embed-nb"]
embed-da = ["uccharan_core/embed-da"]
