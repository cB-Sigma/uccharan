[package]
name = "uccharan"
description = "Drop-in phonemiser for Piper, Kokoro and sherpa-onnx voices: 5× faster than espeak-ng, Apache-2.0."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["g2p", "phonemizer", "tts", "ipa", "hindi"]
categories = ["text-processing", "multimedia::audio", "wasm"]
include = ["src/**", "data/*.ucd", "lang/*.lang", "benches/**", "tests/**", "README.md", "LICENSE", "NOTICE", "DATA_LICENSES.md"]

[features]
default = ["embed-en-us", "embed-en-gb", "embed-hi", "embed-ur", "embed-sd", "embed-kokoro"]
# Compile the language data into the library. Without these, load data at run time with `Phonemizer::load`.
embed-en-us = []
embed-en-gb = []
embed-hi = []
embed-ur = []
embed-sd = []
# misaki's English dictionaries for the Kokoro profile (about 3 MB per accent).
embed-kokoro = []

[dependencies]

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "throughput"
harness = false

